# MR: validate rules and build a preview of the All rules page.
# Default branch: same, then publish the page and CONTRIBUTING.md to the wiki.
stages:
  - validate
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

build-rules:
  stage: validate
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install -q -r build/requirements.txt
  script:
    - python build/build_rules.py --out dist/All-rules.md --source-url "$CI_PROJECT_URL/-/blob/$CI_COMMIT_SHA"
  artifacts:
    paths:
      - dist/All-rules.md
    expose_as: "All rules preview"
    expire_in: 1 week

publish-wiki:
  stage: publish
  image:
    name: alpine/git:2.45.2
    entrypoint: [""]
  needs: [build-rules]
  resource_group: wiki          # one wiki push at a time
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    # WIKI_TOKEN: project access token (role Developer+, scope write_repository),
    # stored as a masked + protected CI/CD variable
    WIKI_URL: "${CI_SERVER_PROTOCOL}://oauth2:${WIKI_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.wiki.git"
  script:
    - sh build/publish_wiki.sh
