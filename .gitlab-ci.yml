# Runs on a Windows shell runner (PowerShell + git, no Python needed).
# MR: validate rules and build a preview of the All rules page.
# Default branch: same, then publish the page and CONTRIBUTING.md to the wiki.
stages:
  - validate
  - publish

build-rules:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File build/build_rules.ps1 -Out dist/All-rules.md -SourceUrl "$env:CI_PROJECT_URL/-/blob/$env:CI_COMMIT_SHA"
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    paths:
      - dist/All-rules.md
    expose_as: "All rules preview"
    expire_in: 1 week

publish-wiki:
  stage: publish
  needs: [build-rules]
  resource_group: wiki          # one wiki push at a time
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    # WIKI_TOKEN: project access token (role Developer+, scope write_repository),
    # stored as a masked + protected CI/CD variable
    WIKI_URL: "${CI_SERVER_PROTOCOL}://oauth2:${WIKI_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.wiki.git"
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File build/publish_wiki.ps1 -Page dist/All-rules.md
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
